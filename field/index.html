<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한담 · 현장관리</title>
<meta name="description" content="한담 현장 통합관리 — 현장관리자">
<meta name="theme-color" content="#7A1A1E">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="한담 · 현장관리">
<meta property="og:description" content="한담 현장 통합관리 — 현장관리자">
<meta property="og:image" content="https://handam-design.github.io/og-field.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="현장관리">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-field.png">
<link rel="manifest" href="../manifest-field.webmanifest">
<style>
html,body{margin:0;height:100%;background:#7A1A1E;overflow:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
iframe{display:block;width:100%;height:100%;border:0;background:#f4f3ef}
.msg{color:#dfe6ea;font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:30vh 24px 0}
.msg b{display:block;font-size:20px;color:#fff;margin-bottom:6px;letter-spacing:.1em}
</style>
<script src="../config.js"></script>
</head>
<body>
<div class="msg" id="msg"><b>HANDAM</b>불러오는 중…</div>
<script>
(function () {
  var src = (function(){return window.HANDAM_APP + '?view=field';})();
  if (!src) return;
  var f = document.createElement('iframe');
  f.src = src; f.title = document.title;
  f.allow = 'clipboard-write; fullscreen';
  f.onload = function () { var m = document.getElementById('msg'); if (m) m.remove(); };
  document.body.appendChild(f);
})();
</script>
</body>
</html>
