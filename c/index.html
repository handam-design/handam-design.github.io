<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한담 · 우리 현장</title>
<meta name="description" content="우리 집 공사 진행 상황, 사진, 요청과 승인을 한곳에서 확인하세요.">
<meta name="theme-color" content="#2c343f">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="한담 · 우리 현장">
<meta property="og:description" content="우리 집 공사 진행 상황, 사진, 요청과 승인을 한곳에서 확인하세요.">
<meta property="og:image" content="../og.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="우리 현장">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">

<style>
html,body{margin:0;height:100%;background:#2c343f;overflow:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
iframe{display:block;width:100%;height:100%;border:0;background:#f4f3ef}
.msg{color:#dfe6ea;font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:30vh 24px 0}
.msg b{display:block;font-size:20px;color:#fff;margin-bottom:6px;letter-spacing:.1em}
</style>
<script src="../config.js"></script>
</head>
<body>
<div class="msg" id="msg"><b>HANDAM</b>불러오는 중…</div>
<script>
(function () {
  var src = (function(){
    var t = (location.hash || '').replace(/^#/, '') || new URLSearchParams(location.search).get('t') || '';
    if (!/^[A-Za-z0-9_-]{16,}$/.test(t)) { document.getElementById('msg').innerHTML = '<b>HANDAM</b>링크가 올바르지 않습니다.<br>한담에 고객 링크를 다시 요청해 주세요.'; return ''; }
    return window.HANDAM_APP + '?view=customer&token=' + encodeURIComponent(t);
  })();
  if (!src) return;
  var f = document.createElement('iframe');
  f.src = src; f.title = document.title;
  f.allow = 'clipboard-write; fullscreen';
  f.onload = function () { var m = document.getElementById('msg'); if (m) m.remove(); };
  document.body.appendChild(f);
})();
</script>
</body>
</html>
